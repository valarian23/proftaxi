# ============================================================
# Конфигурация Nginx для системы корпоративных поездок
# С поддержкой SSL (HTTPS)
# 
# Размещение: /etc/nginx/sites-available/carpool.conf
# ============================================================

# Бэкенд (Node.js) — порт 5123
upstream carpool_backend {
    server 127.0.0.1:5123;
    keepalive 32;
}

# ============================================================
# Редирект с HTTP на HTTPS
# ============================================================
server {
    listen 80;
    server_name carpool.your-company.local;  # ЗАМЕНИТЕ на ваш хост
    
    # Перенаправляем весь HTTP-трафик на HTTPS
    return 301 https://$host$request_uri;
}

# ============================================================
# Основной HTTPS-сервер
# ============================================================
server {
    listen 443 ssl;
    server_name carpool.your-company.local;  # ЗАМЕНИТЕ на ваш хост

    # ============================================================
    # SSL-сертификаты
    # ============================================================
    # Укажите правильные пути к вашим сертификатам
    ssl_certificate     /etc/ssl/certs/carpool.crt;         # ПУТЬ К СЕРТИФИКАТУ
    ssl_certificate_key /etc/ssl/private/carpool.key;       # ПУТЬ К КЛЮЧУ
    
    # Если есть промежуточный сертификат (chain):
    # ssl_trusted_certificate /etc/ssl/certs/carpool-chain.pem;
    
    # Параметры SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    
    # Протоколы и шифры (безопасные настройки)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS (опционально, раскомментируйте если уверены)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # ============================================================
    # Общие настройки
    # ============================================================
    root /opt/carpool/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 1M;

    # ============================================================
    # NTLM-авторизация через Squid
    # ============================================================
    # Squid слушает на localhost:3128 и выполняет NTLM-аутентификацию
    # После успешной авторизации Squid передаёт имя пользователя в заголовке
    
    # Проверка авторизации через Squid
    # Раскомментируйте если Squid настроен как auth_request backend:
    #
    # location = /auth-ntlm {
    #     internal;
    #     proxy_pass http://127.0.0.1:3128;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Original-URI $request_uri;
    #     proxy_set_header Authorization $http_authorization;
    # }
    
    # ============================================================
    # API — проксирование на Node.js бэкенд (порт 5123)
    # ============================================================
    location /api/ {
        # Авторизация (раскомментируйте после настройки Squid):
        # auth_request /auth-ntlm;
        
        proxy_pass http://carpool_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Передаём имя пользователя от Squid
        # Раскомментируйте нужную строку в зависимости от того,
        # как Squid передаёт имя пользователя:
        # proxy_set_header X-Remote-User $http_x_remote_user;
        # proxy_set_header X-Remote-User $remote_user;
        
        # Для отладки — передаём заголовок от Squid как есть:
        proxy_set_header X-Debug-Auth $http_authorization;
        
        # Таймауты
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================================
    # Статические файлы React SPA
    # ============================================================
    location / {
        # Авторизация (раскомментируйте после настройки Squid):
        # auth_request /auth-ntlm;
        
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================
    # Логирование
    # ============================================================
    access_log /var/log/nginx/carpool_access.log;
    error_log /var/log/nginx/carpool_error.log warn;
}
