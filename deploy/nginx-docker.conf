# Nginx конфигурация для Docker-развёртывания
# Отличается от основной тем, что проксирует на Docker-сеть

upstream carpool_backend {
    server backend:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 1M;

    # API — проксирование на бэкенд
    location /api/ {
        proxy_pass http://carpool_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Раскомментируйте после настройки NTLM-авторизации:
        # proxy_set_header X-Remote-User $remote_user;
    }

    # Статика React SPA
    location / {
        try_files $uri $uri/ /index.html;
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    location ~ /\. {
        deny all;
    }
}
