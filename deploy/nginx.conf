# ============================================================
# Конфигурация Nginx для системы корпоративных поездок
# 
# Размещение: /etc/nginx/sites-available/carpool.conf
# (или /etc/nginx/conf.d/carpool.conf)
#
# Функции:
# 1. Раздача статики React-приложения
# 2. Проксирование API-запросов на Node.js бэкенд
# 3. NTLM-авторизация через домен Active Directory
# ============================================================

# Бэкенд (Node.js)
upstream carpool_backend {
    server 127.0.0.1:5123;
    keepalive 32;
}

server {
    listen 80;
    server_name carpool.your-company.local;  # Замените на ваш хост

    # Путь к статическим файлам React (результат npm run build)
    root /opt/carpool/frontend/dist;
    index index.html;

    # Кодировка
    charset utf-8;

    # Размер запросов
    client_max_body_size 1M;

    # ============================================================
    # NTLM-авторизация через Active Directory
    # ============================================================
    # Для NTLM-авторизации необходим модуль nginx ntlm (или spnego-kerberos).
    # В Astra Linux 1.8 можно использовать:
    #   - nginx-extras (если доступен в репозитории)
    #   - Сборка nginx с модулем nginx-auth-ldap или spnego
    #
    # Альтернатива: использовать squid как NTLM-прокси перед nginx
    #
    # Пример конфигурации с nginx-auth-ldap:
    # 
    # ldap_server ad_server {
    #     url ldap://dc01.your-company.local:389/DC=your-company,DC=local?sAMAccountName?sub?(objectClass=person);
    #     binddn "CN=ldap_reader,OU=Service,DC=your-company,DC=local";
    #     binddn_password "ldap_password";
    #     group_attribute member;
    #     group_attribute_is_dn on;
    #     require group "CN=CarpoolUsers,OU=Groups,DC=your-company,DC=local";
    #     require valid_user;
    #     satisfy all;
    # }
    #
    # Для NTLM через squid:
    # auth_request /auth-ntlm;
    # location = /auth-ntlm {
    #     internal;
    #     proxy_pass http://127.0.0.1:3128;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # ============================================================
    # Передача имени пользователя бэкенду
    # ============================================================
    # После NTLM-авторизации Nginx передаёт имя пользователя в заголовке
    # Раскомментируйте нужную строку в зависимости от метода авторизации:
    
    # Для Basic Auth / LDAP:
    # set $remote_user_from_auth $remote_user;
    # proxy_set_header X-Remote-User $remote_user;
    
    # Для NTLM через squid (заголовок от squid):
    # proxy_set_header X-Remote-User $http_x_remote_user;

    # ============================================================
    # API — проксирование на Node.js бэкенд
    # ============================================================
    location /api/ {
        proxy_pass http://carpool_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Передаём имя пользователя (раскомментируйте после настройки авторизации)
        # proxy_set_header X-Remote-User $remote_user;
        
        # Таймауты
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================================
    # Статические файлы React SPA
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
        
        # Кэширование статики
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Логирование
    access_log /var/log/nginx/carpool_access.log;
    error_log /var/log/nginx/carpool_error.log;
}
