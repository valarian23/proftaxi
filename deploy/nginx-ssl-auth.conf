# ============================================================
# Конфигурация Nginx для системы корпоративных поездок
# С авторизацией через отдельный auth-сервис (LDAP/AD)
# 
# Размещение: /etc/nginx/sites-available/carpool.conf
# ============================================================

# Бэкенд (Node.js) — порт 5123
upstream carpool_backend {
    server 127.0.0.1:5123;
    keepalive 32;
}

# Auth-сервис (Node.js) — порт 3002
upstream carpool_auth {
    server 127.0.0.1:3002;
    keepalive 16;
}

# ============================================================
# Редирект с HTTP на HTTPS
# ============================================================
server {
    listen 80;
    server_name carpool.your-company.local;  # ЗАМЕНИТЕ на ваш хост
    
    return 301 https://$host$request_uri;
}

# ============================================================
# Основной HTTPS-сервер
# ============================================================
server {
    listen 443 ssl;
    server_name carpool.your-company.local;  # ЗАМЕНИТЕ на ваш хост

    # ============================================================
    # SSL-сертификаты
    # ============================================================
    ssl_certificate     /etc/ssl/certs/carpool.crt;
    ssl_certificate_key /etc/ssl/private/carpool.key;
    
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ============================================================
    # Общие настройки
    # ============================================================
    root /opt/carpool/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 1M;

    # ============================================================
    # Авторизация через auth-сервис
    # ============================================================
    # Внутренний location для auth_request
    # Nginx делает подзапрос сюда, передавая заголовок Authorization
    location = /auth-check {
        internal;
        proxy_pass http://carpool_auth/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Передаём заголовок Authorization от клиента
        proxy_set_header Authorization $http_authorization;
    }

    # ============================================================
    # API — проксирование на Node.js бэкенд
    # ============================================================
    location /api/ {
        # Проверка авторизации
        auth_request /auth-check;
        
        # Если auth_request вернул 401 — возвращаем 401 клиенту
        auth_request_set $auth_status $upstream_status;
        
        # Передаём заголовки от auth-сервиса бэкенду
        auth_request_set $auth_user $upstream_http_x_remote_user;
        auth_request_set $auth_display_name $upstream_http_x_remote_display_name;
        
        proxy_pass http://carpool_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Передаём имя пользователя от auth-сервиса
        proxy_set_header X-Remote-User $auth_user;
        proxy_set_header X-Remote-Display-Name $auth_display_name;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Обработка ошибок авторизации
        error_page 401 = @error401;
    }

    # Обработка 401 — возвращаем WWW-Authenticate
    location @error401 {
        add_header WWW-Authenticate 'Basic realm="Корпоративные поездки"' always;
        return 401 'Authentication required';
    }

    # ============================================================
    # Статические файлы React SPA
    # ============================================================
    location / {
        # Авторизация для статики (опционально — можно убрать)
        auth_request /auth-check;
        auth_request_set $auth_user $upstream_http_x_remote_user;
        
        error_page 401 = @error401;
        
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Без авторизации для статики (быстрее)
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================
    # Логирование
    # ============================================================
    access_log /var/log/nginx/carpool_access.log;
    error_log /var/log/nginx/carpool_error.log warn;
}
